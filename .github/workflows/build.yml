name: Build
on:
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
    branches:
      - Alpha
    tags:
      - "v*"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jobs:
          - {goos: linux, goarch: amd64, goamd64: v1, output: amd64}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: "1.26"

      - name: Verify Go installation
        run: go version

      - name: Verify Go env
        run: go env

      - name: Set variables
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME,,}"
          else
            VERSION="${GITHUB_REF_NAME,,}-$(git rev-parse --short HEAD)"
          fi
          VERSION="${VERSION//\//-}"
          {
            echo "VERSION=${VERSION}"
            echo "BUILDTIME=$(date)"
            echo "CGO_ENABLED=0"
            echo "BUILDTAG=-extldflags --static"
            echo "GOTOOLCHAIN=local"
          } >> "$GITHUB_ENV"

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt component/ca/ca-certificates.crt

      - name: Build core
        env:
          GOOS: ${{matrix.jobs.goos}}
          GOARCH: ${{matrix.jobs.goarch}}
          GOAMD64: ${{matrix.jobs.goamd64}}
        run: |
          go env
          go build -v -tags "with_gvisor" -trimpath -ldflags "${BUILDTAG} -X 'github.com/metacubex/mihomo/constant.Version=${VERSION}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME}' -w -s -buildid="
          cp mihomo mihomo-${{matrix.jobs.goos}}-${{matrix.jobs.output}}
          gzip -c mihomo-${{matrix.jobs.goos}}-${{matrix.jobs.output}} > "mihomo-${{matrix.jobs.goos}}-${{matrix.jobs.output}}-${VERSION}.gz"
          rm mihomo-${{matrix.jobs.goos}}-${{matrix.jobs.output}}

      - name: Archive production artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "mihomo-${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}"
          path: |
            mihomo*.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: mihomo-linux-amd64
          path: bin/

      - name: Calculate checksums
        run: |
          cd bin/
          sha256sum mihomo*.gz > checksums.txt
          cat checksums.txt

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            bin/*
          generate_release_notes: true
